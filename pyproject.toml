[build-system]
requires = ["setuptools>61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mimic"
description = "MIMIC: MIMetic Initial Conditions generator for cosmological simulations."
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Krishna Naidoo", email = "krishna.naidoo.11@ucl.ac.uk"}]
maintainers = [{name = "Krishna Naidoo", email = "krishna.naidoo.11@ucl.ac.uk"}]
keywords = ["astronomy", "mathematics", "simulations"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numba",
    "numpy",
    "scipy",
    "shift-fft",
    "fiesta-pkg"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/knaidoo29/MIMIC"
Repository = "https://github.com/knaidoo29/MIMIC"
Documentation = "https://mimic-docs.readthedocs.io/en/latest/"
"Bug Tracker" = "https://github.com/knaidoo29/MIMIC/issues"
Changelog = "https://github.com/knaidoo29/MIMIC/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["black", "flake8", "ipython", "jupyter", "mypy"]
docs = ["numpydoc", "sphinx", "sphinx-rtd-theme"]
test = [
    "pytest>=6.0",
    "pytest-cov"
]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.packages.find]
where = ["."]
exclude = ["build", "build.*", "dist*", "*.egg-info", "docs*", "tests*", "tutorials*"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
mimic = ["*.json", "*.md", "*.txt"]